[Service]
# Lunaris: unknown monitor setups are extended side by side (Sway-like), known ones get their saved profile.
# dwm-autorandr waits while the screens are blanked (a sleeping monitor looks unplugged), then runs
#   /usr/bin/autorandr --batch --change --default horizontal
ExecStart=
ExecStart=/usr/local/bin/dwm-autorandr
# it may wait for the screens to wake up
TimeoutStartSec=infinity
