# dwm-btw: SDDM login screen
[Theme]
Current=sugar-candy-dwm
CursorTheme=capitaine-cursors
CursorSize=24
Font=JetBrainsMono Nerd Font,11

[General]
# no on-screen keyboard
InputMethod=

[X11]
# default Xsetup + the keyboard layouts on the login screen (fr,ir by default; install.sh --keyboard/--layouts)
DisplayCommand=/etc/sddm/Xsetup-dwm-btw

[Users]
RememberLastUser=true
RememberLastSession=true
