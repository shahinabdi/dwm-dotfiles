# Live GTK settings (read by running GTK apps). Font size is changed by dwm-display.
Net/ThemeName "Adwaita-dark"
Net/IconThemeName "Papirus-Dark"
Gtk/CursorThemeName "capitaine-cursors"
Gtk/CursorThemeSize 24
Gtk/FontName "JetBrainsMono Nerd Font Mono Ultra-Light 11"
Xft/DPI 98304
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintmedium"
